# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: SoD Platform
site_description: Plataforma de Access Governance com evolução para SoD transacional
site_author: Lucas Alexandre

theme:
  name: material
  language: pt-BR
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

nav:
  - Início: index.md
  - Parte I — Negócio:
      - O problema e as duas fases: negocio/problema-e-fases.md
      - Vocabulário essencial: negocio/vocabulario.md
      - Regras de negócio: negocio/regras-de-negocio.md
      - Hipóteses e dados sintéticos: negocio/hipoteses-e-dados-sinteticos.md
      - Resposta aos 9 desafios: negocio/resposta-ao-case.md
  - Parte II — Arquitetura:
      - Arquitetura inicial: arquitetura/arquitetura-inicial.md
      - Fundamentos de Segurança: arquitetura/fundamentos-seguranca.md
      - Evolução da solução: arquitetura/evolucao.md
      - Arquitetura V2 atual: arquitetura/arquitetura-v2.md
      - Arquitetura alvo AWS: arquitetura/aws.md
      - Evolução para Fase 2: arquitetura/fase-2.md
  - Parte III — Técnica:
      - Pipeline e contratos de dados: tecnica/pipeline.md
      - Access Intelligence: tecnica/access-intelligence.md
      - Evidence, Policy, Risk e Gold: tecnica/evidence-policy-risk-gold.md
      - Orquestração e observabilidade: tecnica/orquestracao-observabilidade.md
      - Validação e testes: tecnica/validacao-observabilidade.md
      - Dashboard e operação: tecnica/dashboard-operacao.md
  - Resultados da POC: resultados.md
  - Parte IV — Decisões:
      - Experimentos e shadow mode: decisoes/experimentos.md
      - Premissas, controles e evolução: decisoes/limitacoes.md
      - Uso de IA no desenvolvimento: decisoes/uso-ia.md
  - Referência:
      - Execução local: referencia/execucao-local.md
      - Estrutura do repositório: referencia/estrutura-repositorio.md

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/site.css

extra_javascript:
  - javascripts/mermaid-zoom.js

extra:
  generator: false
