# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: SoD Platform
site_description: Plataforma de Analytics para Segregação de Funções

theme:
  name: material
  language: pt-BR
  logo: material/shield-account
  favicon: material/shield-account
  palette:
    # Paleta inspirada na identidade visual do Itaú: laranja e azul-escuro.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/itau.css
