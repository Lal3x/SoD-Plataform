name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Java for Spark tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install project and tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          SPARK_MASTER: local[1]
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build Streamlit image
        run: docker build -f Dockerfile -t sod-platform-streamlit:ci .
      - name: Build Airflow image
        run: docker build -f orchestration/airflow/Dockerfile -t sod-platform-airflow:ci .
