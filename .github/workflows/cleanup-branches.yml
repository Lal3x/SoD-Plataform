name: Cleanup merged branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches except main and dev
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            case "$branch" in
              main|dev)
                echo "Keeping $branch"
                ;;
              *)
                echo "Deleting $branch"
                encoded_branch=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["BRANCH"], safe=""))' BRANCH="$branch")
                gh api -X DELETE "repos/$REPO/git/refs/heads/$encoded_branch"
                ;;
            esac
          done
